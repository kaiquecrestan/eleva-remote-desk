name: Eleva Remote Desk - Linux Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  ELEVA_VERSION: "1.0.0"
  ELEVA_REMOTE_ID_SERVER: "desk.elevabs.com:21116"
  ELEVA_REMOTE_RELAY_SERVER: "desk.elevabs.com:21117"
  ELEVA_REMOTE_API_URL: "https://api-remote.elevabs.com"
  ELEVA_REMOTE_PUBLIC_KEY: "${{ secrets.ELEVA_REMOTE_PUBLIC_KEY || 'i+pabfCpXmuL5lB8axrW56XyZxrj0d4O3bOYJgLyfIo=' }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-linux:
    name: Build Linux x86_64 (.deb)
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list || true
          sudo apt-get update -y
          sudo apt-get install -y --fix-broken || true
          sudo apt-get install -y libunwind-dev || true
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpam0g-dev \
            libpulse-dev \
            libva-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            nasm \
            ninja-build \
            pkg-config \
            python3 \
            wget

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Build Eleva Remote Desk Linux
        run: |
          ./build.py --flutter --unix-file-copy-paste

      - name: Find and Package .deb Artifacts
        run: |
          mkdir -p dist
          find . -name "*.deb" -exec cp {} dist/ \;
          cd dist
          for f in *.deb; do
            mv "$f" "ElevaRemoteDesk-Linux-x86_64.deb"
            break
          done
          ls -la

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElevaRemoteDesk-Linux-x86_64
          path: dist/*.deb

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release-tag != ''
        with:
          tag_name: ${{ inputs.release-tag || github.ref_name }}
          files: |
            dist/*.deb
