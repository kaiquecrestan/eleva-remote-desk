name: Eleva Remote Desk - Windows Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  ELEVA_VERSION: "1.0.0"
  ELEVA_REMOTE_ID_SERVER: "desk.eleva.art:21116"
  ELEVA_REMOTE_RELAY_SERVER: "desk.eleva.art:21117"
  ELEVA_REMOTE_PUBLIC_KEY: "${{ secrets.ELEVA_REMOTE_PUBLIC_KEY || 'lgVtWWXXcESrw+SAurhht5h8aU6sTkvaqdI05IHTZuY=' }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    strategy:
      fail-fast: false

  build-windows:
    name: Build Eleva Remote Desk Windows x64
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        shell: powershell
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace Flutter engine with custom Windows engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          Copy-Item -Path "windows-x64-release\*" -Destination "C:\hostedtoolcache\windows\flutter\stable-${{ env.FLUTTER_VERSION }}-x64\bin\cache\artifacts\engine\windows-x64-release\" -Recurse -Force

      - name: Patch Flutter dropdown menu
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "windows-x64"

      - name: Install pkg-config and configure host MSYS2
        run: |
          Write-Host "Installing MSYS2 build utilities and native pkgconf via MSYS2 bash..."
          & "C:\msys64\usr\bin\bash.exe" -lc "pacman -S --noconfirm --needed make perl automake1.16 automake autoconf diffutils patch mingw-w64-x86_64-pkgconf pkgconf"

          # Ensure pkg-config exists at C:\msys64\mingw64\bin\pkg-config.exe
          $pkgConfig = "C:\msys64\mingw64\bin\pkg-config.exe"
          if (-not (Test-Path $pkgConfig)) {
            Write-Host "Checking /mingw64 and /usr/bin alternatives..."
            if (Test-Path "C:\msys64\mingw64\bin\pkgconf.exe") {
              Copy-Item "C:\msys64\mingw64\bin\pkgconf.exe" -Destination $pkgConfig -Force
            } elseif (Test-Path "C:\msys64\usr\bin\pkg-config.exe") {
              Copy-Item "C:\msys64\usr\bin\pkg-config.exe" -Destination $pkgConfig -Force
            } elseif (Test-Path "C:\msys64\usr\bin\pkgconf.exe") {
              Copy-Item "C:\msys64\usr\bin\pkgconf.exe" -Destination $pkgConfig -Force
            }
          }

          # Also ensure C:\msys64\usr\bin has pkg-config
          if (-not (Test-Path "C:\msys64\usr\bin\pkg-config.exe")) {
            if (Test-Path "C:\msys64\usr\bin\pkgconf.exe") {
              Copy-Item "C:\msys64\usr\bin\pkgconf.exe" -Destination "C:\msys64\usr\bin\pkg-config.exe" -Force
            } elseif (Test-Path $pkgConfig) {
              Copy-Item $pkgConfig -Destination "C:\msys64\usr\bin\pkg-config.exe" -Force
            }
          }

          Write-Host "Verifying pkg-config execution..."
          & $pkgConfig --version

          "PKG_CONFIG=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          [Environment]::SetEnvironmentVariable("PKG_CONFIG", $pkgConfig, "Machine")

      - name: Setup vcpkg with caching
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Patch vcpkg to use host MSYS2
        run: |
          Copy-Item -Path "res\vcpkg\vcpkg_acquire_msys.cmake" -Destination "C:\vcpkg\scripts\cmake\vcpkg_acquire_msys.cmake" -Force
          Write-Host "Replaced vcpkg_acquire_msys.cmake - vcpkg will now use C:/msys64 directly."
          Write-Host "pkg-config is at: C:\msys64\mingw64\bin\pkg-config.exe"

      - name: Install vcpkg static dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $env:VCPKG_DEFAULT_HOST_TRIPLET = "x64-windows-static"
          $env:PKG_CONFIG = "C:\msys64\mingw64\bin\pkg-config.exe"
          $env:PATH = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;$env:PATH"
          if (-not $env:ACTIONS_RUNTIME_TOKEN -or -not $env:ACTIONS_CACHE_URL) {
            Write-Host "Actions cache token not found. Falling back to local binary caching."
            $env:VCPKG_BINARY_SOURCES = "clear;default,readwrite"
          } else {
            Write-Host "Actions cache token detected. Enabling GitHub Actions binary caching."
            $env:VCPKG_BINARY_SOURCES = "clear;x-gha,readwrite"
          }
          $vcpkg = if (Test-Path "$env:VCPKG_ROOT\vcpkg.exe") { "$env:VCPKG_ROOT\vcpkg.exe" } elseif (Test-Path "C:\vcpkg\vcpkg.exe") { "C:\vcpkg\vcpkg.exe" } else { "vcpkg" }
          Write-Host "Using vcpkg executable at: $vcpkg"
          & $vcpkg install --triplet x64-windows-static --host-triplet x64-windows-static --x-install-root="C:\vcpkg\installed"

          # Sync any dynamic host headers/libs into static target if present
          if (Test-Path "C:\vcpkg\installed\x64-windows\include") {
            Write-Host "Syncing x64-windows include headers to x64-windows-static..."
            Copy-Item -Path "C:\vcpkg\installed\x64-windows\include\*" -Destination "C:\vcpkg\installed\x64-windows-static\include\" -Recurse -Force
          }
          if (Test-Path "C:\vcpkg\installed\x64-windows\lib") {
            Write-Host "Syncing x64-windows lib files to x64-windows-static..."
            Copy-Item -Path "C:\vcpkg\installed\x64-windows\lib\*" -Destination "C:\vcpkg\installed\x64-windows-static\lib\" -Recurse -Force
          }

          Write-Host "Contents of C:\vcpkg\installed\x64-windows-static\include:"
          Get-ChildItem "C:\vcpkg\installed\x64-windows-static\include" | Select-Object -First 15

      - name: Build Core and Flutter application
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          python .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          Move-Item -Path .\flutter\build\windows\x64\runner\Release -Destination .\rustdesk -Force

      - name: Download RustDeskTempTopMostWindow artifact
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts
          path: .\rustdesk

      - name: Package Single Standalone Executable
        run: |
          (Get-Content res\manifest.xml) -notmatch "dpiAware" | Set-Content res\manifest.xml
          Push-Location libs\portable
          pip install -r requirements.txt
          python generate.py -f ..\..\rustdesk\ -o . -e ..\..\rustdesk\rustdesk.exe
          Pop-Location
          New-Item -ItemType Directory -Force -Path dist
          Move-Item -Path target\release\rustdesk-portable-packer.exe -Destination dist\ElevaRemoteDesk.exe -Force

      - name: Build NSIS Setup Installer
        run: |
          New-Item -ItemType Directory -Force -Path res\app
          Copy-Item rustdesk\* -Destination res\app -Recurse -Force
          Copy-Item "rustdesk\rustdesk.exe" -Destination "res\app\Eleva Remote Desk.exe" -Force
          & "C:\Program Files (x86)\NSIS\makensis.exe" res\setup.nsi
          Move-Item -Path "res\ElevaRemoteDesk-Setup-x64.exe" -Destination "dist\ElevaRemoteDesk-Setup-x64.exe" -Force

      - name: Generate Checksums and Source Archive
        run: |
          $tag = "${{ github.ref_name || inputs.release-tag }}"
          git archive --format=zip --prefix="eleva-remote-desk-$tag/" HEAD -o "dist\source-$tag.zip"
          
          Set-Location dist
          Get-FileHash -Algorithm SHA256 ElevaRemoteDesk.exe, ElevaRemoteDesk-Setup-x64.exe, "source-$tag.zip" | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Out-File -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Set-Location ..

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ElevaRemoteDesk-Windows-x64
          path: dist\*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release-tag != ''
        with:
          tag_name: ${{ github.ref_name || inputs.release-tag }}
          name: Eleva Remote Desk ${{ github.ref_name || inputs.release-tag }}
          body: |
            ## Eleva Remote Desk ${{ github.ref_name || inputs.release-tag }}
            
            Cliente de acesso remoto oficial do ecossistema Eleva Remote, baseado no projeto open source RustDesk sob licença AGPL-3.0.
            
            ### Artefatos Disponíveis
            - `ElevaRemoteDesk.exe`: Executável portátil para Windows x64 (não requer instalação).
            - `ElevaRemoteDesk-Setup-x64.exe`: Instalador completo do Windows com registro automático do serviço de acesso em segundo plano.
            - `SHA256SUMS.txt`: Hashes de integridade criptográfica SHA-256.
            - `source-${{ github.ref_name || inputs.release-tag }}.zip`: Código-fonte correspondente a esta compilação.
            
            ### Conformidade AGPL-3.0
            Código-fonte correspondente público: [https://github.com/kaiquecrestan/eleva-remote-desk](https://github.com/kaiquecrestan/eleva-remote-desk)
          files: |
            dist/ElevaRemoteDesk.exe
            dist/ElevaRemoteDesk-Setup-x64.exe
            dist/source-*.zip
            dist/SHA256SUMS.txt
